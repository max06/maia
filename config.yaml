deploymentsDir: deployments

# Every type is defined here. Nothing is hardcoded in the Go program.
# A type needs a name (the key). Everything else is optional:
#   match:  glob patterns for file names (default: "<name>.yaml")
#   schema: a JSON Schema, written as YAML (default: anything is valid)
#   scope:  "directory" (default): values apply to the whole directory tree below
#           "file": values only apply when viewing this file itself
types:
  # Shared values for everything in the directory where the file sits, and below.
  defaults:
    schema:
      type: object
      properties:
        replicas: { type: integer, minimum: 1 }
        logLevel: { enum: [debug, info, warn, error] }
        resources:
          type: object
          properties:
            cpu:    { type: string }
            memory: { type: string }

  cluster:
    schema:
      type: object
      additionalProperties: false   # unknown keys (typos) are errors
      required: [clusterName]
      properties:
        clusterName:
          type: string
          minLength: 1

  application:
    schema:
      type: object
      additionalProperties: false
      required: [image, replicas, port]
      properties:
        image:
          type: string
          minLength: 1
        replicas:
          type: integer
          minimum: 1
        port:
          type: integer
          minimum: 1
          maximum: 65535
